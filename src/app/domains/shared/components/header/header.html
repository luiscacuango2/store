<nav>
  <div
    class="w-full flex flex-wrap items-center justify-between mx-auto py-4">
    <div class="flex items-center space-x-8">
      <a href="https://flowbite.com/" class="flex items-center ">
        <img
          src="https://flowbite.com/docs/images/logo.svg"
          class="h-6 mr-3"
          alt="Flowbite Logo"
        />
        <span class="self-center text-xl font-semibold whitespace-nowrap"
          >Flowbite</span
        >
      </a>
      <ul class="flex space-x-6">
        <li>
          <a
            href="#"
            class="block underline hover:underline"
            aria-current="page"
            >Inicio</a
          >
        </li>
        <li>
          <a
            href="#"
            class="block hover:underline"
            >Acerca de</a
          >
        </li>
        <li>
          <a
            href="#"
            class="block hover:underline"
            >Servicios</a
          >
        </li>
      </ul>
    </div>
    <div class="flex items-center">
        <button 
            class="p-2 border border-gray-200 rounded-lg relative cursor-pointer hover:bg-gray-50 transition-colors" 
            (click)="toggleSideMenu()" 
            aria-label="Abrir carrito"
            type="button">

            @if (totalItems() > 0) {
            <span class="absolute -top-2 -left-2 z-20 h-5 w-5 bg-black text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white">
                {{ totalItems() }}
            </span>
            }

            <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 text-gray-700"
            >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"
            />
            </svg>
        </button>
    </div>
  </div>
</nav>

<div
  class="fixed border-l border-gray-200 top-0 right-0 bg-red z-40 w-72 h-screen p-4 overflow-y-auto transition-transform bg-white"
  [class.translate-x-full]="hideSideMenu()"
>
  <div class="flex justify-between items-center">
    <p class="text-xl">Mi Carrito</p>
    <button class="p-2 border rounded relative cursor-pointer" (click)="toggleSideMenu()">     
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-6 h-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>
  <div class="mt-4">
    @for (product of cart(); track product.id) {
      <div class="flex justify-between items-center mt-4 border-b pb-4 border-gray-100">
            <div class="flex space-x-4">
                <img 
                [src]="product.image" 
                [alt]="product.title" 
                class="w-16 h-16 object-cover rounded" 
                >
                <div>
                <h4 class="font-medium text-sm text-gray-700">{{ product.title }}</h4>
                <p class="text-gray-600 font-bold">{{ product.price | currency }}</p>
                </div>
            </div>
            <button 
                class="text-red-600 hover:text-red-800 cursor-pointer text-xs"
                (click)="removeFromCart(product)">
                Eliminar
            </button>
        </div>
    } @empty {
      <div class="flex flex-col items-center justify-center mt-20 text-gray-400">
        <span class="text-4xl mb-2">🛒</span>
        <p>Tu carrito está vacío</p>
      </div>
    }
  </div>

  <div class="mt-auto border-t border-gray-200 pt-4 px-2">
        <div class="flex justify-between items-center mb-4">
            <span class="text-gray-500 font-medium">Total a pagar:</span>
            <span class="text-xl font-bold text-gray-900">
            {{ total() | currency }}
            </span>
        </div>

        <button 
            class="w-full bg-black text-white py-3 rounded-lg font-semibold hover:bg-gray-800 transition-colors cursor-pointer disabled:bg-gray-300 disabled:cursor-not-allowed"
            [disabled]="totalItems() === 0">
            Finalizar Compra
        </button>
    </div>

</div>

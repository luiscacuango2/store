<div class="group rounded-lg border border-gray-200 bg-white hover:shadow-md transition-shadow">
    <div class="w-full bg-white">
      <img 
        [src]="product.image" 
        [alt]="product.title" 
        class="w-full h-52 object-cover border-b border-gray-100 block"
      >
    </div>
    <div class="flex flex-col space-y-2 p-4">
      <h3 class="text-sm text-gray-700 font-medium line-clamp-1">{{ product.title }}</h3>
      <p class="text-lg font-bold text-gray-900">{{ product.price | currency }}</p>
      <p class="text-[10px] text-gray-400 font-semibold uppercase tracking-tight">
        Lanzamiento: {{ product.createdAt | date }}
      </p>
      <button 
        class="mt-2 text-black bg-gray-100 font-semibold rounded-lg text-sm px-5 py-2.5 w-full hover:bg-black hover:text-white transition-all cursor-pointer"
        (click)="addToCartHandler()">
        Agregar al carrito
      </button>
    </div>
  </div>
